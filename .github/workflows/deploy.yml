name: CD — Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dynafare

jobs:
  # ─── Build & Push images ─────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-service
        uses: docker/build-push-action@v6
        with:
          context: api-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-service:${{ github.sha }},${{ env.IMAGE_PREFIX }}/api-service:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/api-service:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/api-service:buildcache,mode=max

      - name: Build & push ml-service
        uses: docker/build-push-action@v6
        with:
          context: ml-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ml-service:${{ github.sha }},${{ env.IMAGE_PREFIX }}/ml-service:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/ml-service:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/ml-service:buildcache,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: infra/nginx
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/nginx:${{ github.sha }},${{ env.IMAGE_PREFIX }}/nginx:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/nginx:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/nginx:buildcache,mode=max

  # ─── Deploy to staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to staging
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/secrets.yaml
          kubectl apply -f infra/k8s/configmaps.yaml
          kubectl apply -f infra/k8s/infrastructure.yaml
          kubectl apply -f infra/k8s/kafka.yaml
          kubectl apply -f infra/k8s/api-service.yaml
          kubectl apply -f infra/k8s/ml-service.yaml
          kubectl apply -f infra/k8s/nginx.yaml
          kubectl set image deployment/api-service api-service=${{ env.IMAGE_PREFIX }}/api-service:${{ github.sha }} -n dynafare-dev
          kubectl set image deployment/ml-service ml-service=${{ env.IMAGE_PREFIX }}/ml-service:${{ github.sha }} -n dynafare-dev
          kubectl rollout status deployment/api-service -n dynafare-dev
          kubectl rollout status deployment/ml-service -n dynafare-dev

  # ─── Manual gate + prod deploy ───────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to production
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/secrets.yaml
          kubectl apply -f infra/k8s/configmaps.yaml
          kubectl apply -f infra/k8s/infrastructure.yaml
          kubectl apply -f infra/k8s/kafka.yaml
          kubectl apply -f infra/k8s/api-service.yaml
          kubectl apply -f infra/k8s/ml-service.yaml
          kubectl apply -f infra/k8s/nginx.yaml
          kubectl set image deployment/api-service api-service=${{ env.IMAGE_PREFIX }}/api-service:${{ github.sha }} -n dynafare-dev
          kubectl set image deployment/ml-service ml-service=${{ env.IMAGE_PREFIX }}/ml-service:${{ github.sha }} -n dynafare-dev
          kubectl rollout status deployment/api-service -n dynafare-dev
          kubectl rollout status deployment/ml-service -n dynafare-dev
