name: CD — Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dynafare

jobs:
  # ─── Build & Push images ─────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-service
        uses: docker/build-push-action@v6
        with:
          context: api-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-service:${{ github.sha }},${{ env.IMAGE_PREFIX }}/api-service:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/api-service:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/api-service:buildcache,mode=max

      - name: Build & push ml-service
        uses: docker/build-push-action@v6
        with:
          context: ml-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ml-service:${{ github.sha }},${{ env.IMAGE_PREFIX }}/ml-service:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/ml-service:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/ml-service:buildcache,mode=max

  # ─── Deploy to staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: echo "Deploy to staging — configure kubectl + kubeconfig secret here"
        # TODO: kubectl apply -k infra/k8s/overlays/staging

  # ─── Manual gate + prod deploy ───────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploy to production — configure kubectl + kubeconfig secret here"
        # TODO: kubectl apply -k infra/k8s/overlays/prod
