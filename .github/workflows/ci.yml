name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Python ML Service ──────────────────────────────────────────────────────
  ml-service:
    name: Python — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: pytest tests/ -v

  # ─── Java API Service ───────────────────────────────────────────────────────
  api-service:
    name: Java — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn verify -B

  # ─── Docker build validation ─────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [ml-service, api-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build api-service image
        run: docker build api-service/ --tag dynafare/api-service:ci

      - name: Build ml-service image
        run: docker build ml-service/ --tag dynafare/ml-service:ci

      - name: Build nginx image
        run: docker build infra/nginx/ --tag dynafare/nginx:ci
