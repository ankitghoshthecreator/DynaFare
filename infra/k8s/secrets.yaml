# ─── Secret: application credentials ────────────────────────────────────────
# In production, source these from AWS Secrets Manager, HashiCorp Vault, or
# External Secrets Operator — never commit real values to source control.
# These are base64-encoded placeholders for local/dev use only.
#
# To encode: echo -n 'value' | base64
# dynafare_secret  → ZHluYWZhcmVfc2VjcmV0
# dynafare         → ZHluYWZhcmU=
# changeme_super_secret_jwt_key_min_32_chars → Y2hhbmdlbWVfc3VwZXJfc2VjcmV0X2p3dF9rZXlfbWluXzMyX2NoYXJz
apiVersion: v1
kind: Secret
metadata:
  name: dynafare-secrets
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/part-of: dynafare
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: ZHluYWZhcmU=
  SPRING_DATASOURCE_PASSWORD: ZHluYWZhcmVfc2VjcmV0
  POSTGRES_DB: ZHluYWZhcmU=
  POSTGRES_USER: ZHluYWZhcmU=
  POSTGRES_PASSWORD: ZHluYWZhcmVfc2VjcmV0
  JWT_SECRET: Y2hhbmdlbWVfc3VwZXJfc2VjcmV0X2p3dF9rZXlfbWluXzMyX2NoYXJz
