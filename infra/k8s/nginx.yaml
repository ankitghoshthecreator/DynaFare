# ─── Deployment: nginx ingress/proxy ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: dynafare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/name: nginx
    spec:
      containers:
        - name: nginx
          image: ghcr.io/ankitghoshthecreator/dynafare/nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
# ─── Service: nginx (LoadBalancer — gets an external IP from cloud provider) ──
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: dynafare
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
