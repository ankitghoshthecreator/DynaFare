# ─── Deployment: ml-service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: dynafare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ml-service
        app.kubernetes.io/name: ml-service
    spec:
      containers:
        - name: ml-service
          image: ghcr.io/ankitghoshthecreator/dynafare/ml-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-service-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5

---
# ─── Service: ml-service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: dynafare
spec:
  selector:
    app: ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ─── HorizontalPodAutoscaler: ml-service ─────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-service-hpa
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: dynafare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
