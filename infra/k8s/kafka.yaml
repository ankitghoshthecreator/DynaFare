# ─── StatefulSet: Zookeeper ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: dynafare
spec:
  serviceName: "zookeeper-service"
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ─── Service: zookeeper ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: dynafare
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  type: ClusterIP

---
# ─── StatefulSet: Kafka ───────────────────────────────────────────────────────
# For production: use a managed Kafka (Confluent Cloud, MSK, Upstash Kafka) instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: dynafare
spec:
  serviceName: "kafka-service"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5

---
# ─── Service: kafka ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: dynafare
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
  type: ClusterIP
