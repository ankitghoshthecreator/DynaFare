# ─── Deployment: api-service ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: dynafare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-service
        app.kubernetes.io/name: api-service
    spec:
      containers:
        - name: api-service
          image: ghcr.io/ankitghoshthecreator/dynafare/api-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dynafare-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynafare-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dynafare-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5

---
# ─── Service: api-service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: dynafare
spec:
  selector:
    app: api-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ─── HorizontalPodAutoscaler: api-service ────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service-hpa
  namespace: dynafare-dev
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: dynafare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
